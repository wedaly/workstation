sandbox_mode = "workspace-write"
approval_policy = "never"
allow_login_shell = false
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
model_verbosity = "low"

[features]
plugins = false
hooks = false

[permissions.filesystem]
deny_read = [
  "~/.aws",
  "~/.ssh",
  "~/.kube",
  "~/.docker",
]
